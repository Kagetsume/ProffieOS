<!doctype html>
<!-- ProffieOS SD Config Editor — served via Vite (npm run dev). See website/README.md -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Frontend-only editor for ProffieOS SD card config INI files" />
    <title>ProffieOS SD Config Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var stored = localStorage.getItem('po-theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('wa-dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header class="app-bar">
        <po-app-shell></po-app-shell>
      </header>
      <div class="app-body">
        <aside class="app-sidebar">
          <po-sidebar-nav></po-sidebar-nav>
        </aside>
        <main id="page-root" class="app-main"></main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
