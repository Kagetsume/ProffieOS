<!doctype html>
<!-- LayerBlade — served via Vite (npm run dev). See website/README.md -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LayerBlade — browser editor for ProffieOS SD blade styles, presets, and config INI files" />
    <title>LayerBlade · SD blade styles for ProffieOS</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        var stored = localStorage.getItem('lb-theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('wa-dark');
        }
        if (localStorage.getItem('layerblade.sidebarCollapsed') === 'true') {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header class="app-bar">
        <lb-app-shell></lb-app-shell>
      </header>
      <div class="app-body">
        <aside class="app-sidebar">
          <lb-sidebar-nav></lb-sidebar-nav>
        </aside>
        <main id="page-root" class="app-main"></main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
