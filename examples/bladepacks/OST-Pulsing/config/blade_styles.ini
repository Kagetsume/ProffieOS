# =============================================================================
# OST-Pulsing blade pack — smooth idle pulse (no flicker textures)
# =============================================================================
# Copy to SD: config/blade_styles.ini
#
# Presets reference:  style = config ost_pulsing base=<color>
# Optional overrides: pulse_ms= pulse_delta= clash= lockup= drag= melt= lb= ext= ret=
# =============================================================================

# ---- [ost_pulsing]: OT solid beam + smooth brightness pulse + responsive combat ----
[ost_pulsing]
base = blue
clash = white
lockup = white
drag = white
melt = orange
lb = white
pulse_ms = 500
pulse_delta = 20
ext = -1
ret = -1
layer = solid_bend {{base}} {{ext}} {{ret}}
layer = multiply opacity 100% pulse_layer {{pulse_ms}} {{pulse_delta}}
layer = responsive_clash {{clash}}
layer = responsive_blast {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
layer = add opacity 18% swing white 220
