# =============================================================================
# First Order blade pack — Sequel trilogy blades (layer-first where possible)
# =============================================================================
# Copy to SD: config/blade_styles.ini
#
# Presets:  style = config fo_kylo_unstable
# Overrides: base= warmer= hot= spark= clash= ext= ret= drag= melt= lb=
# =============================================================================

# ---- [fo_kylo_unstable]: Kylo Ren — crackling red unstable (built-in "unstable" base) ----
# Uses firmware named style "unstable" (BrownNoise + strobe crackle, localized clash, audio lockup).
# Single main strip only — crossguard side blades are a separate physical blade / accent in hardware.
# Optional: style = config fo_kylo_unstable base=red warmer=red hot=orange spark=yellow
[fo_kylo_unstable]
base = red
warmer = red
hot = orange
spark = yellow
clash = white
ext = -1
ret = -1
drag = white
melt = orange
lb = white
layer = unstable {{base}} {{warmer}} {{hot}} {{spark}} {{ext}} {{ret}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
