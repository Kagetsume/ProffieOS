# =============================================================================
# OST blade pack — layered OT-style recipes
# =============================================================================
# Copy to SD: config/blade_styles.ini
#
# Presets reference:  style = config ost_classic base=<color>
# Optional overrides: clash= lockup= drag= melt= lb= ext= ret= (ext/ret default -1 = sound length)
# =============================================================================

# ---- [ost_classic]: OT solid beam + subtle flicker + responsive combat ----
[ost_classic]
base = blue
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
layer = solid_bend {{base}} {{ext}} {{ret}}
# base_flicker: delta% min_ms max_ms — hold time per bright/dim step; keep min/max low for quick flashes (not long dwell).
layer = multiply opacity 100% base_flicker 7 15 25
#layer = multiply opacity 22% noise_flicker black white
layer = responsive_clash {{clash}}
layer = responsive_blast {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
layer = add opacity 18% swing white 220
