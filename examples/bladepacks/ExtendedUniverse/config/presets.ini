# =============================================================================
# Extended Universe blade pack — presets
# =============================================================================
# Copy to SD: config/presets.ini
#
# font= is an SD root folder (e.g. SmthJedi/). font_overlay= per character WAV overrides.
# =============================================================================

new_preset
font = SmthJedi
font_overlay = font/DarkSaber
track = tracks/hum.wav
style = config eu_darksaber
name = DarkSaber
variation = 0

