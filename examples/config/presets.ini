# =============================================================================
# config/presets.ini - Preset list (font, track, style, name)
# =============================================================================
# Copy to SD card as:  config/presets.ini  (folder must be named exactly "config")
#
# When present and valid, this REPLACES the compiled preset list. Each preset
# is a block: new_preset, then font=, track=, style= (one per blade), name=,
# variation=, then the next new_preset or "end". Up to 64 presets.
#
# STYLE TYPES:
#   style = <named_style> <args>
#       Uses a built-in named style directly. The first word is the style name
#       (standard, fire, rainbow, water_flow, fallen_order, unstable, strobe, cycle,
#        advanced, accent_*, config, …).
#       Remaining words are arguments: colors, times, etc. Use  config <section>
#       to load layered styles from config/blade_styles.ini (see below).
#
#   style = config <section_name>
#       Loads a multi-layer style from [section_name] in config/blade_styles.ini.
#       You MUST also copy blade_styles.ini to the SD card. Section names match
#       [brackets] in that file and are case-sensitive.
#       If blade_styles.ini uses "include = blade_styles/....ini", copy those too.
#
#   style = config <section_name> key=value key2=value2
#       Same as above, but overrides {{key}} variables defined in that section.
#       The section provides defaults; presets can customize colors, times, etc.
#       Fett263 Edit Mode saves preset style= lines only — not blade_styles.ini layers.
#       See doc/README_blade_styles_config.md (Edit Mode vs layer stacks).
#
# NUM_BLADES 4: four style = lines per preset (blade indices 0–3).
# Index 0: NeoPixel main strip.
# Index 1 (Blade 2 / Free1): style = accent_pulse 1500       (fast white pulse)
# Index 2 (Blade 3 / Free2): style = accent_sound_on white 4096  (motor while audio plays)
# Index 3 (Blade 4 / Free3): style = accent_glow    (follows hum volume)
# Omit power_pin for the accent; use type=simple in blades.ini (see examples/config/blades.ini).
# If you only wire one or two strips, adjust NUM_BLADES in CONFIG_FILE accordingly.
#
# NAMED STYLE QUICK REFERENCE (args in order):
#   accent_pulse [pulse_ms]              (GPIO pulse; default 3000 ms)
#   accent_sound_on [color threshold]    (GPIO on while audio above threshold; default white 4096)
#   accent_on                            (GPIO solid on while blade is out — no args)
#   accent_glow [color]                  (GPIO smooth hum brightness; default white)
#   accent_strobe [flash freq_hz flash_ms]  (GPIO strobe; default white 15 1)
#   accent_audio_flicker [base flicker]  (GPIO jittery hum flicker; default black white)
#   accent_clash [idle flash]            (GPIO idle + clash flash; default dim_white white)
#   accent_color [color]                 (GPIO solid color; default white)
#   accent_pulse_color [color pulse_ms]  (GPIO pulse to color; default white 3000)
#   accent_flicker [base flicker]        (GPIO organic flicker; default black white)
#   accent_blink [color on_ms off_ms]    (GPIO square blink; default white 500 500)
#   accent_sequence <steps>              (GPIO timed steps pixel,r,g,b,brightness,ms|…; off when retracted)
#   accent_lockup [idle lockup]          (GPIO idle + lockup color; default dim_white white)
#   accent_swing [color speed]           (GPIO swing brightening; default white 200)
#   accent_blast [idle flash]            (GPIO idle + blast flash; default dim_white white)
#   accent_drag [color]                  (GPIO drag lockup; default orange)
#   accent_melt [color]                  (GPIO melt lockup; default orange_red)
#   accent_battery [color]               (GPIO battery level; default green)
#   accent_sparkle [color]               (GPIO random twinkle; default white)
#   accent_preon [color]                 (GPIO preon glow only; default white)
#   accent_postoff [color]               (GPIO postoff glow only; default red)
#   real_clash [color lockup_pos]        (OS7 Real Clash V1 overlay; default white 16000)
#   responsive_clash [color]             (blade-angle clash bump overlay; default white)
#   blast_wave_random [color]            (OS7 random blast wave overlay; default white)
#   responsive_blast [color]             (blade-angle blast wave overlay; default white)
#   config composable_checklist            (capstone full composable stack — see blade_styles.ini)
#   standard <base> <clash> <extend> <retract> [lockup] [blast]
#   fire <warm> <hot>
#   rainbow <extend> <retract> [clash] [lockup]
#   gradient <hilt> <tip> <clash> <blast> <lockup> <extend> <retract>
#   audio <base> <flicker> <clash> <extend> <retract>
#   flicker <warm> <hot> <clash> <extend> <retract>
#   sparktip <base> <clash> <extend> <retract> <spark_tip>
#   sparkle_blade <base> <sparkle> <blast> <lockup> <clash> <extend> <retract>
#   cylon <scan_color> <clash> <extend> <retract>
#   pulse_blade <off> <on> <pulse_ms> <extend> <retract>
#   water_flow <base> <clash> <extend> <retract>   (angle-reactive flow; firmware required)
#   darksaber <base> <clash> <extend> <retract>  (metallic stripes; firmware required)
#   static_electricity <base> <clash> <extend> <retract>  (swing charge; firmware required)
#   power_wave <base> <clash> <extend> <retract>          (wide stripes; firmware required)
#   unstable_blades <base> <clash> <extend> <retract>     (crackling stripes; NOT style "unstable")
#   fallen_order <base> <clash> <extend> <retract>        (pulsing stripes; firmware required)
#   unstable [warm] [warmer] [hot] [sparks] [extend_ms] [retract_ms]
#   strobe <standby> <flash> <freq_hz> <flash_ms> [extend_ms] [retract_ms]
#   cycle <start> <base> <flicker> <blast> <lockup>
#   advanced <hilt> <mid> <tip> <spark> <spark_ms> <blast> <lockup> <clash>
#            <extend_ms> <retract_ms> <spark_tip>
#
# OVERLAY LAYERS (use in blade_styles.ini; stack on opaque base):
#   blast <color>   clash <color>   localized_clash <color>   lockup <color>
#   sparkle <color>   pulse <color> [pulse_ms]   swing <color> [speed]
#   drag <color>   melt <color>   lb <color>
#   See examples/config/blade_styles.ini — [rainbow_pulse], [standard_swing_sparkle], etc.
#
# PREON / POSTOFF STYLES (transparent layers — use in blade_styles.ini):
#   preon_glow <color>       (uniform glow, brightness = sound volume)
#   preon_wipe <color>       (hilt→tip wipe over sound duration)
#   preon_sputter <color>    (blade length = sound volume)
#   postoff_glow <color>     (uniform glow, brightness = sound volume)
#   postoff_wipe <color>     (tip→hilt wipe over sound duration)
#   postoff_sputter <color>  (blade length = sound volume)
#   Duration is automatic — matches the preon/postoff sound file length.
#   Audio-reactive styles (glow, sputter) track sound volume in real time.
#   See blade_styles.ini for full documentation and layered examples.
#
# COLOR NAMES (from styles/rgb_arg.h): red green blue cyan yellow magenta white black
#   orange darkorange deeppink deepskyblue dodgerblue hotpink pink tomato coral aqua
#   lime fuchsia springgreen steelblue silver greenyellow chartreuse
#   Or Rgb(r,g,b) with integers 0–255.
# Fett263 OS7 SD approximations (see blade_styles.ini for layer breakdown):
#   sine_waves_cyan — cyan base + four sine_waves masks + OS7 combat overlays (preset 0)
#   smoke_laser     — green beam + smoke_flow + random_bands (not stripes; see [smoke_blade]) (preset 1)
#   smoke_sine_cyan — cyan solid_bend + smoke_flow + sine_waves + OS7 combat overlays (preset 2)
#   smoke_blade     — SmokeBlade-style: solid base + smoke_flow + clash/blast overlays (preset 11)
# Texture demos (base + one composable mask): demo_saw_waves demo_smoothstep_bands
#   demo_value_noise demo_fbm_noise demo_moire_mask demo_blade_envelope
#   demo_sine_waves_swing demo_sine_waves demo_random_bands demo_pulse_train demo_chirp
#   water_blade      — WaterBlade-style angle-reactive flow (water_flow firmware style)
#   darksaber_blade         — DarkSaber metallic stripes (darksaber firmware style)
#   static_electricity_blade — swing charge / clash dissipate (static_electricity firmware)
#   power_wave_blade         — wide slow reverse stripes (power_wave firmware)
#   unstable_blades          — Fett263 Unstable Pulse crackling stripes (unstable_blades firmware)
#   fallen_order_blade       — Fallen Order pulsing stripes (fallen_order firmware)
#   energy_blade             — Surging Pulse fast stripes (SD-only; Fett263 EnergyBlade OS7)
#   rolling_surge            — Slow wide stripes + audio hum (SD-only; Fett263 OS7 Master Sol option)
#   pulse_stripes / pulse_stripes_sd — ignition-surge stripes (Fett263 OS7; firmware base)
#   energy_core              — flickering core + silver stripes (SD-only; EnergyBlade core option)
#   particle_beam            — silver + blue stream beam (SD-only; Fett263 Ghostbusters OS7)
#   rotating_pulse / rotating_pulse_sd — Rotating Pulse Saw-modulated stripes (firmware)
#   trickle_blade / trickle_blade_sd — energy trickle blade (firmware; Fett263 OS7 idle base)
#   thunder_storm / thunder_storm_sd — Fett263 ThunderStorm (thunder_loop + optional real_clash)
#   responsive_flame / responsive_flame_sd — Fett263 ResponsiveFlame (angle-responsive fire base)
#   ignition_flash_demo — standard_bend + ignition_flash (SeismicCharge-style in/out)
#   greyscale_mercenary / greyscale_coda — Fett263 Greyscale SD recipes (smoke + swing / pulse)
#   shimmer_blade / shimmer_blade_sd — Fett263 ShimmerBlade (interactive swing shimmer)
#   rotoscope / rotoscope_sd       — Fett263 Rotoscope (hyper responsive OT rotoscope idle)
#   kinetic_charge / kinetic_charge_sd — clash/lockup kinetic charge (Fett263 BlackPanther OS7 idle base)
# Texture recipes (base + fire_mask/stripes/noise — no extra firmware beyond reflash):
#   solid_smoke solid_lava solid_unstable solid_shimmer solid_chase
#   composable_gradient composable_gradient_tint composable_audio composable_breathe
#   composable_crackle composable_shimmer
#   solid_water_shimmer solid_barber
# =============================================================================

# ---- Optional first line (install timestamp); can omit ----
# installed = Dec 25 2024 12:00:00

# ---- Preset 0: Sine Waves Cyan (four-wave multiply mask — SD config example) ----
# Applies [sine_waves_cyan] from config/blade_styles.ini (first section in that file).
# Requires blade_styles.ini on the SD card — style = config <section> loads layered recipes.
new_preset
font = LiquidStatic
track = tracks/hum.wav
style = config sine_waves_cyan
style = accent_pulse 1500
style = accent_sound_on white 4096
style = accent_glow
name = Sine Waves Cyan
variation = 0

