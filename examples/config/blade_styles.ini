# =============================================================================
# COMPOSABLE LAYER RECIPES (solid_bend base + texture overlays — no monoliths)
# =============================================================================
# Pattern: solid_bend {{base}} {{ext}} {{ret}} + textures + combat overlays.
# normal/add textures auto-clip to base in/out — no ext/ret on those lines.
# multiply/screen composable textures (audio_layer, pulse_layer, …) — no ext/ret.
# smoke_flow — MUST pass {{ext}} {{ret}} on each line (own InOut; see header EXTEND/RETRACT).
# Override from presets:  style = config composable_gradient base=purple hilt=purple tip=white
# (Use section vars for colors referenced as {{name}} in layers below.)
#
# ---- COMPOSABLE CHECKLIST (layer catalog — see [composable_checklist] below) ----
#   BASE (pick one bottom layer):
#     solid_bend, solid, standard_bend, standard
#   IDLE TEXTURES — normal/add (opacity = mix vs base; no ext/ret):
#     gradient_layer, rainbow_layer, stripes, hard_stripes (add/multiply)
#   IDLE TEXTURES — multiply/screen (no ext/ret):
#     audio_layer, pulse_layer, swing_layer, base_flicker, per_led_flicker,
#     noise_flicker, fire_mask, unstable_stripes
#   IDLE TEXTURES — OS7 *_layer (no ext/ret; needs firmware):
#     water_flow_layer, darksaber_layer, static_electricity_layer, power_wave_layer,
#     fallen_order_layer, shimmer_blade_layer, rotoscope_layer, pulse_stripes_layer,
#     kinetic_charge_layer, rotating_pulse_layer, trickle_blade_layer, cylon_layer,
#     thunder_loop_layer, responsive_flame_layer, sparktip_layer
#   IDLE TEXTURES — smoke (ext/ret MUST match base on each line):
#     smoke_flow, smoke_up, smoke_down
#   TRANSITIONS (transparent until preon/postoff/ignition):
#     preon_glow, preon_wipe, preon_sputter, postoff_glow, postoff_wipe, postoff_sputter,
#     ignition_flash, sparktip_layer (add over base during extend)
#   CLASH (pick one — transparent until clash):
#     clash, localized_clash, responsive_clash, real_clash
#   BLAST (pick one — transparent until blast):
#     blast, blast_wave_random, responsive_blast
#   LOCKUP (stack all that apply):
#     responsive_lockup (or lockup), drag, melt, lb
#   OPTIONAL EVENT/IDLE:
#     sparkle (add), pulse (multiply/add), swing (add), force_glow (add), blast (legacy)
#   NOT COMPOSABLE (monolith only): cycle, advanced, legacy unstable
#
# Preset:  style = config composable_checklist
# Responsive variant:  style = config composable_checklist_responsive

# ---- [composable_checklist]: Capstone — full composable stack (OS7 combat path) ----
# Working demo of base + textures + transitions + OS7 clash/blast + lockup suite.
# Swap clash/blast lines using the CHECKLIST above; do not stack multiple clash types.
[composable_checklist]
base = blue
hilt = blue
tip = cyan
spark = white
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = 300
ret = 800
preon = cyan
postoff = red
layer = solid_bend {{base}} {{ext}} {{ret}}
layer = normal opacity 12000 gradient_layer {{hilt}} {{tip}}
layer = multiply opacity 32768 audio_layer
layer = add opacity 5000 sparkle white
layer = preon_glow {{preon}}
layer = postoff_glow {{postoff}}
layer = add opacity 32768 sparktip_layer {{spark}} {{ext}} {{ret}}
layer = real_clash {{clash}} 16000
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
layer = add opacity 7000 swing white 250

