# ---- [sputter_gate]: Audio-reactive sputter ignition/shutdown ----
# Uses the preon_sputter and postoff_sputter styles, which track sound
# intensity from the audio system in real time.  Instead of fading or
# wiping a solid color, the blade EXTENDS AND RETRACTS from the hilt
# proportional to how loud the preon/postoff sound is at each moment.
# Duration automatically matches the sound file length via WavLen.
#
# HOW IT WORKS (per-frame, per-LED):
#   1. RampF returns each LED's position: 0 at hilt, 32768 at tip.
#   2. SmoothSoundLevel returns a smoothed audio envelope (0-32768) via an
#      IIR low-pass filter on abs(audio samples) with sqrtf compression.
#      It tracks LOUDNESS over time — rises when sound is loud, decays
#      slowly when quiet.
#   3. IsLessThan<RampF, SmoothSoundLevel> compares them: if the LED's
#      position is below the current loudness, it's ON; otherwise OFF.
#   4. AlphaL uses that as the opacity — so each LED is either fully colored
#      or fully transparent depending on the comparison.
#   5. TrDelayX<WavLen<EFFECT_PREON>> holds the effect for exactly the
#      preon sound file duration. No manual timing needed.
#   Result: loud sound = blade extends far from hilt; quiet = shrinks back.
#   The envelope-following creates visible, smooth blade length changes
#   that track the sound's volume contour. As the sound fades at the end,
#   the blade naturally retracts to the hilt and becomes transparent.
#
# VISUAL RESULT:
#   Press button → blade sputters from the hilt, chaotically extending and
#   retracting with the preon sound (for its full duration) → preon sound
#   ends → main cyan blade ignites → normal use with blast → press off →
#   blade retracts → red sputter appears, extending/retracting with the
#   postoff sound → postoff sound ends → blade disappears → LEDs off.
[sputter_gate]
# Layer 1 — Solid cyan blade (opaque base, normal blend)
#   Main blade with 300ms extension and 800ms retraction.
layer = solid cyan 300 800
# Layer 2 — Clash flash
layer = clash white
# Layer 3 — Blast flash (transparent, normal blend)
layer = blast white
# Layer 3 — Preon sputter (EFFECT_PREON, audio-reactive blade length)
#   Blue sputter: blade length follows preon sound volume in real time.
#   Duration automatically matches preon sound file length via WavLen.
#   Loud preon sound = blade extends, quiet = retracts toward hilt.
layer = preon_sputter blue
# Layer 4 — Postoff sputter (EFFECT_POSTOFF, audio-reactive blade length)
#   Red sputter: blade length follows postoff sound volume after retraction.
#   Duration automatically matches postoff sound file length via WavLen.
#   As the postoff sound fades, the blade shrinks and disappears.
layer = postoff_sputter red

