# =============================================================================
# config/blade_styles.ini - Named style "recipes" (layers of effects)
# =============================================================================
# Keep  layer = <style> <args>  lines aligned with firmware  named_styles[]
# in styles/style_parser.h (argument counts, preon/postoff/force_glow = color only + WavLen).
#
# Firmware: in ProffieOS.ino set  #define CONFIG_FILE "config/config-files-config.h"
#           (see config/config-files-config.h for SD INI layout + fallbacks).
# Copy to SD:  config/blade_styles.ini  (same folder as config/presets.ini)
#
# User guide (examples + use cases): website/BLADE_STYLES.md
#
# HOW IT WORKS:
#   In presets.ini, use  style = config <section_name>  to load a section from
#   this file. Each section defines one or more layers that are composited in
#   order (bottom to top, like Photoshop layers). The first layer is the base;
#   each subsequent layer is drawn on top.
#
# LAYER FORMAT:
#   layer = <style_name> <args>
#       Creates a layer from a named style (standard, fire, rainbow, etc.).
#       The style is rendered as a full blade, then composited onto the stack.
#
#   layer = <blend> opacity <0-32768> <style_name> <args>
#       Same, but with a blend mode and/or opacity applied before compositing.
#       Blend modes: normal (default), multiply, screen, add.
#       Opacity: 0 = fully transparent, 32768 = fully opaque.
#
#   layer = config <other_section>
#       Nests another section's layers into this one (recursive composition).
#
# BLEND MODE GUIDE:
#   normal   — standard alpha-over: overlay replaces base where opaque.
#   add      — overlay color is added to base (brightens, good for flashes).
#   screen   — like add but won't clip to white as harshly (good for glows).
#   multiply — overlay darkens base (black=full dim, white=no change).
#              Great for masks: a grayscale overlay controls base brightness.
#
# IMPORTANT: Full blade styles (standard, fire, rainbow, gradient, audio,
#   water_flow, darksaber, static_electricity, power_wave, unstable_blades,
#   fallen_order, unstable, strobe, cycle, advanced, …) produce OPAQUE output.
#   Without a blend mode + opacity, they cover layers below them. Overlay
#   styles (blast, clash, pulse, swing, preon_*, postoff_*, force_glow, …) are mostly
#   transparent until their event fires.
#
# VARIABLES:
#   Define variables in a section (name = value), then use {{name}} in layers.
#   Presets can override variables: style = config section base=red clash=blue
#
# PALETTES:
#   [palette_<id>] sections define reusable variable sets.
#   Use "palette = <id>" in a section to import those variables.
#
# STRUCTURED LAYERS:
#   layer.<style>.<slot> = value  is an alternative to the single-line format.
#   Slot names match the style's argument order (see structured_* sections).
#   Supported in firmware today: standard, fire, rainbow, strobe, cycle,
#   unstable, advanced — NOT preon_glow / preon_wipe / preon_sputter /
#   postoff_* (use  layer = preon_glow blue  style lines for those).
#
# INCLUDES:
#   include = path/to/file.ini  merges another file's layers into the section.
#   Top-level include (outside any section) loads palette sections from that file.
#
# NAMED STYLE QUICK REFERENCE (args in order):
#   standard <base> <clash> <extend_ms> <retract_ms> [lockup] [blast]
#       Solid blade with clash flash, lockup, blast, and extension/retraction.
#   solid <base> <extend_ms> <retract_ms>
#       Solid opaque base with extension/retraction only — no built-in clash/lockup/blast.
#       Stack overlay layers (clash, blast, lockup, …) for composable recipes.
#   solid_bend <base> <extend_ms> <retract_ms>
#       Like solid but OS7 BendTimePow extend/retract curves.
#   extend_ms / retract_ms: use -1 to match ignition/retraction soundfont length (WavLen).
#   fire <warm_color> <hot_color>
#       Rolling flame effect. Heat propagates along the blade creating
#       organic bright/dark zones. No extension/retraction animation.
#   rainbow <extend_ms> <retract_ms> [clash] [lockup]
#       Hue-cycling rainbow blade with clash, lockup, and extension/retraction.
#   gradient <hilt> <tip> <clash> <blast> <lockup> <extend_ms> <retract_ms>
#   audio <base> <flicker> <clash> <extend_ms> <retract_ms>
#   flicker <warm> <hot> <clash> <extend_ms> <retract_ms>
#   sparktip <base> <clash> <extend_ms> <retract_ms> <spark_tip>
#   sparkle_blade <base> <sparkle> <blast> <lockup> <clash> <extend_ms> <retract_ms>
#   cylon <scan_color> <clash> <extend_ms> <retract_ms>
#   pulse_blade <off> <on> <pulse_ms> <extend_ms> <retract_ms>
#   water_flow <base> <clash> <extend_ms> <retract_ms>
#       Fett263 WaterBlade-style StripesX: angle-reactive flow, swing reversal on hard upward swing.
#   darksaber <base> <clash> <extend_ms> <retract_ms>
#       Fett263 DarkSaber OS7: metallic stripes, brown-noise, audio flicker, swing gleam (default base silver).
#   static_electricity <base> <clash> <extend_ms> <retract_ms>
#       Fett263 StaticElectricity OS7: swing builds charge, clash dissipates (default base deepskyblue).
#   power_wave <base> <clash> <extend_ms> <retract_ms>
#       Fett263 PowerWave OS7: wide slow reverse stripes (default base silver).
#   unstable_blades <base> <clash> <extend_ms> <retract_ms>
#       Fett263 UnstableBlades OS7: crackling StripesX + SlowNoise speed (NOT named style "unstable").
#   fallen_order <base> <clash> <extend_ms> <retract_ms>
#       Fett263 FallenOrder OS7: wide stripes with pulsing mid-band (default base silver).
#   thunder_loop <base> <clash> <extend_ms> <retract_ms>
#       Fett263 ThunderStorm OS7 idle loop: TrBoing + rolling stripes + SlowNoise delay (default base blue).
#   thunder_loop_layer <base>
#       ThunderStorm loop animation only — multiply/screen over opaque base (default blue).
#   responsive_flame <base> <clash> <extend_ms> <retract_ms>
#       Fett263 ResponsiveFlame OS7: angle-responsive dual StaticFire gradient (default base red).
#   responsive_flame_layer <base>
#       ResponsiveFlame idle texture only — multiply/screen over opaque base (default red).
#   shimmer_blade <base> <clash> <extend_ms> <retract_ms>
#       Fett263 ShimmerBlade OS7: interactive swing shimmer (default base cyan).
#   rotoscope <base> <clash> <extend_ms> <retract_ms>
#       Fett263 Rotoscope OS7: hyper responsive OT rotoscope (default base silver).
#   pulse_stripes <base> <clash> <extend_ms> <retract_ms>
#       Fett263 OS7 ignition-surge stripes + pulsing band (default base blue).
#   kinetic_charge <base> <kinetic> <clash> <extend_ms> <retract_ms>
#       Clash/lockup charge kinetic_color; long swing releases (Fett263 BlackPanther OS7 idle base; default blue + purple).
#   rotating_pulse <base> <clash> <extend_ms> <retract_ms>
#       Fett263 EnergyBlade Rotating Pulse: wide stripes, Saw-modulated speed reverses direction (default base blue).
#   trickle_blade <base> <clash> <extend_ms> <retract_ms>
#       Energy trickle: angle stripes + StaticFire tip weight + HoldPeakF swing bands (Fett263 OS7; default green).
#   standard_bend <base> <clash> <extend_ms> <retract_ms> [lockup] [blast]
#       Like standard but OS7 BendTimePow extend/retract curves (Fett263 default bend).
#   ignition_flash <color> <extend_ms> <fade_ms>
#       Full-blade flash during EFFECT_IGNITION (default white 300 600). Stack on any base.
#
# OVERLAY LAYERS (stack on an opaque base; many are transparent until triggered):
#   blast <color>              — flash on blast (transparent when idle; fixed wave)
#   blast_wave_random <color>  — OS7 random wave blast (position + duration vary)
#   responsive_blast <color>   — blade-angle positioned blast wave (ResponsiveBlastWaveL)
#   clash <color>                — flash on clash
#   localized_clash <color>      — positioned clash band (random position)
#   responsive_clash <color>     — blade-angle positioned clash bump (ResponsiveClashL)
#   real_clash <color> [lockup_pos] — OS7 Real Clash V1 (impact selects effect path; default white 16000)
#   lockup <color>               — ResponsiveLockupL (localized bump, blade-angle reactive)
#   responsive_lockup <color>    — same as lockup (explicit layer name)
#   sparkle <color>              — random sparkles (use add/screen blend)
#   pulse <color> [pulse_ms]     — breathing overlay (use add or multiply)
#   swing <color> [speed]        — brightens when swinging (use add)
#   drag <color>                 — responsive drag effect
#   melt <color>                 — responsive melt effect
#   lb <color>                   — lightning block effect
#
# EXTEND/RETRACT IN LAYERED RECIPES:
#   Base layer (solid, solid_bend, …) MUST set extend_ms retract_ms (use {{ext}} {{ret}}).
#   Use -1 to match ignition/retraction soundfont length (InOutFuncAuto / WavLen).
#
#   normal/add textures (gradient_layer, stripes add, …):
#     NO ext/ret on the texture line — ConfigLayersStyle auto-clips to base lit pixels.
#
#   multiply/screen textures WITHOUT own InOut (audio_layer, pulse_layer, swing_layer,
#     fire_mask, per_led_flicker, …):
#     NO ext/ret on the texture line.
#
#   Textures WITH own InOut — MUST pass the SAME ext/ret as the base on EACH layer line:
#     smoke_flow <dark> <light> <extend_ms> <retract_ms> [speed]
#     Example: layer = multiply opacity 24000 smoke_flow black white {{ext}} {{ret}}
#     speed defaults to 1 (current roll); 2 = twice as fast.
#     Use smoke_flow for smoke blades (NOT smoke_up/smoke_down as the recipe).
#     Preset: style = config smoke_blade ext=-1 ret=-1  (updates all {{ext}}/{{ret}} lines).
#
# TEXTURE OVERLAYS (masks — use multiply / screen / add over opaque base):
#   fire_mask <warm> <hot>       — rolling heat (StaticFire); smoke/lava masks
#   smoke_flow <dark> <light> <extend_ms> <retract_ms> [speed]
#     Offset dual-band smoke; ext/ret REQUIRED (match solid base). speed optional (default 1).
#     multiply black white; screen bright wisps: black + base color (e.g. black {{base}}).
#   stripes <width> <speed> <c1> <c2>  — soft moving stripes
#   hard_stripes <width> <speed> <c1> <c2>  — hard-edged bands
#   base_flicker [delta% min_ms max_ms] — uniform +/- brightness flicker on all pixels below
#       (default 10 300 500). Stack: layer = multiply opacity 32768 base_flicker 10 300 500
#   pulse_layer [pulse_ms] — smooth breathing +/- 10% brightness (default 3000). Same multiply stack.
#   swing_layer [delta% speed_threshold] — uniform +brightness on swing (default 10 200). multiply stack.
#       Preserves hue vs add swing (white gleam). No ext/ret on layer line.
#   gradient_layer hilt tip — hilt-to-tip gradient; normal blend + opacity = mix vs base (32768 full, ~3277 10%)
#   rainbow_layer — animated RGB rainbow; normal blend + opacity tints base toward full rainbow (no args)
#       No ext/ret — auto-clipped to base in/out.
#   audio_layer — hum-reactive uniform brightness (no args); multiply over any base
#       No ext/ret on layer line.
#   per_led_flicker — per-LED random brightness mask (no args); multiply over any base
#       No ext/ret on layer line.
#   noise_flicker [base flicker] — organic crackle (default black white)
#   unstable_stripes [base]      — UnstableBlades band only (default silver)
#   water_flow_layer [base]      — WaterBlade angle-reactive stripes (Fett263 OS7 idle only)
#   darksaber_layer [base]       — DarkSaber metallic flicker stripes (OS7 idle only)
#   static_electricity_layer [base] — charge state machine (OS7 idle only)
#   power_wave_layer [base]      — PowerWave wide slow stripes (OS7 idle only)
#   fallen_order_layer [base]    — FallenOrder pulsing mid-band stripes (OS7 idle only)
#   shimmer_blade_layer [base]   — ShimmerBlade swing shimmer (OS7 idle only)
#   rotoscope_layer [base]       — Rotoscope acceleration bands (OS7 idle only)
#   pulse_stripes_layer [base]   — ignition-surge pulse stripes (OS7 idle only)
#   kinetic_charge_layer base kinetic — clash/lockup charge stripes (OS7 idle only)
#   rotating_pulse_layer [base]  — Saw-modulated reversing stripes (OS7 idle only)
#   trickle_blade_layer [base]   — angle flame trickle (OS7 idle only)
#   cylon_layer scan percent rpm — scanner band; use add over solid_bend
#   sparktip_layer spark ext ret — spark at extension front; ext/ret must match solid_bend base
#   pixel_sequence config <steps>  — timed chase (pixel,r,g,b,brightness,ms|…)
#
#   unstable <warm> <warmer> <hot> <sparks> <extend_ms> <retract_ms>
#       Crackling blade with BrownNoiseFlicker, strobe, AudioFlicker lockup,
#       clash, blast, and OnSpark. All args optional (good defaults).
#   strobe <standby_color> <flash_color> <freq_hz> <flash_ms> [ext] [ret]
#       Alternates between standby and flash colors at the given frequency.
#   blast <color>
#       Transparent overlay — invisible until a blast event, then flashes.
#       The only built-in style safe to use as a layer without blend modes.
#       The SD named "blast" style uses fixed fade/wave timing in firmware
#       (200 / 100 / 400 ms); only the blast color is configurable from INI.
#   cycle <start> <base> <flicker> <blast_color> <lockup_color>
#       Color-cycling blade with AudioFlicker, blast, lockup, and clash.
#   advanced <hilt> <mid> <tip> <spark> <spark_ms> <blast> <lockup> <clash>
#            <ext> <ret> <spark_tip>
#       Gradient blade with OnSpark, AudioFlicker lockup, and InOutSparkTip.
#
# PREON / POSTOFF STYLES (transparent transition layers):
#
#   All preon/postoff styles take ONLY a color argument. Duration is
#   automatic — each style uses WavLen to match its visual duration to the
#   preon/postoff SOUND FILE length. No manual timing needed. The prop
#   waits for the preon sound to finish before igniting the main blade,
#   so the visual and audio end at the same moment. Similarly, postoff
#   visuals match the pstoff sound (effect name pstoff; font folder pstoff/).
#
#   AUDIO-REACTIVE effects (glow, sputter) use SmoothSoundLevel to drive
#   blade brightness or length from the audio envelope in real time.
#   Loud sound = bright/long blade, quiet = dim/short. As the sound
#   naturally fades at the end, the visual fades too — no jarring cut.
#
#   preon_glow <color>
#       Entire blade glows uniformly. Brightness follows preon sound volume.
#       Duration = preon sound file length (automatic via WavLen).
#       Loud preon sound = bright glow, quiet = dim, silence = transparent.
#       Example: preon_glow blue
#
#   preon_wipe <color>
#       Color sweeps from hilt to tip over the preon sound duration.
#       A directional "preview" of the blade path before ignition.
#       Duration = preon sound file length (automatic via WavLen).
#       Example: preon_wipe green
#
#   preon_sputter <color>
#       Blade LENGTH extends from hilt proportional to preon sound volume.
#       Loud = blade extends far, quiet = shrinks back, silence = no blade.
#       Duration = preon sound file length (automatic via WavLen).
#       Example: preon_sputter blue
#
#   postoff_glow <color>
#       Entire blade glows uniformly after retraction. Brightness follows
#       postoff sound volume. Naturally fades as the sound ends.
#       Duration = postoff sound file length (automatic via WavLen).
#       Example: postoff_glow red
#
#   postoff_wipe <color>
#       Color wipes from tip to hilt over the postoff sound duration.
#       A "draining" retraction effect after the main blade has retracted.
#       Duration = postoff sound file length (automatic via WavLen).
#       Example: postoff_wipe white
#
#   postoff_sputter <color>
#       Blade LENGTH extends from hilt proportional to postoff sound volume.
#       Same audio-reactive mechanism as preon_sputter but after retraction.
#       Duration = postoff sound file length (automatic via WavLen).
#       Example: postoff_sputter red
#
#   force_glow <color>
#       Full-blade glow on EFFECT_FORCE (while saber is on). Brightness follows
#       force sound volume; duration = force sound file length (WavLen).
#       Requires font force/ sounds and prop/button mapped to Force.
#       Example: add opacity 12000 force_glow white
#
#   ignition_flash <color> <extend_ms> <fade_ms>
#       Full-blade flash during EFFECT_IGNITION (during extension, not preon).
#       Held for extend_ms then fades over fade_ms. Example: ignition_flash white 300 600
#
#   HOW PREON/POSTOFF WORK:
#     These styles are TRANSPARENT during normal operation — they produce
#     no output when the blade is on or off. They only activate when their
#     trigger event fires (EFFECT_PREON or EFFECT_POSTOFF). The transition
#     plays once and returns to transparent.
#
#     Add them as regular layers in any section. No blend mode or opacity
#     is needed (they handle transparency internally). You can combine
#     multiple preon/postoff layers, or mix them with any other layers.
#
#     TIMING:
#       Preon plays BEFORE ignition: button press → preon animation →
#       preon sound plays simultaneously → sound finishes → main blade
#       ignites. The visual duration automatically matches the sound.
#       Postoff plays AFTER retraction: blade fully retracts → postoff
#       animation plays → postoff sound plays simultaneously → sound
#       finishes → blade LEDs power off.
#
#     AUDIO-REACTIVE BEHAVIOR:
#       glow and sputter effects track SmoothSoundLevel in real time.
#       SmoothSoundLevel is an IIR-filtered audio envelope (0-32768)
#       that follows loudness. It responds to ALL audio playing through
#       the speaker, which during preon/postoff is dominated by the
#       preon/postoff sound file. As the sound fades at the end, the
#       visual naturally fades too — no abrupt cut-off.
#
#     PREON/POSTOFF SOUND FILES:
#       If your font folder contains a "preon" subfolder with WAV files,
#       one is played when EFFECT_PREON fires. Similarly, "pstoff" WAV
#       files play on EFFECT_POSTOFF. The styles automatically detect
#       the sound duration and match their visual to it.
#
#     POWER MANAGEMENT:
#       The blade LEDs must stay powered during preon/postoff even though
#       the main blade style says "off". The firmware handles this
#       automatically — TransitionEffectConfigL signals the blade to stay
#       powered while its transition is running.
# =============================================================================

# Optional: extra palette sections from config/blade_styles/palettes_extra.ini
# (if this file doesn't exist on the SD card, the include is silently skipped)
include = blade_styles/palettes_extra.ini

# =============================================================================
# BASIC EXAMPLES — single and multi-layer styles
# =============================================================================

# ---- [smoke_laser]: Laser through rolling smoke (first SD config example) ----
# smoke_flow extend/retract must match solid (same {{ext}}/{{ret}}; -1 = sound length).
[smoke_laser]
base = green
ext = 300
ret = 800
lockup = white
drag = white
melt = orange
lb = white
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 24000 smoke_flow black white {{ext}} {{ret}}
layer = screen opacity 4000 smoke_flow black {{base}} {{ext}} {{ret}}
layer = clash white
layer = blast white
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [plain_rainbow]: Single layer ----
# One rainbow blade with 300ms extension and 800ms retraction (built-in clash/lockup/blast).
[plain_rainbow]
layer = rainbow 300 800

# ---- [rainbow_strobe]: Two layers with blend mode ----
# Rainbow base with white strobe pulses overlaid. The strobe is a full
# opaque style, so we use ADD blend + opacity to let the rainbow show
# through. Without "add opacity", the strobe would completely hide the
# rainbow. ADD means the strobe's white flashes BRIGHTEN the rainbow.
# Opacity 16000 (~49%) keeps the pulses from being too overwhelming.
# Args: strobe standby=black, flash=white, freq=15 Hz, pulse=1 ms,
#        extend=300 ms, retract=800 ms.
[rainbow_strobe]
layer = rainbow 300 800
layer = add opacity 16000 strobe black white 15 1 300 800

# ---- [fire_blast]: Fire base + transparent blast overlay ----
# Fire is the base layer (opaque, rolling flame animation). The blast
# layer uses BlastL which is TRANSPARENT until a blast event — so the
# fire shows through normally, and white flashes appear on blast.
# This is the correct way to add blast to a fire blade: blast is the
# one built-in style that works as a layer without needing blend modes.
# Args: fire warm=red hot=yellow; blast color=white.
[fire_blast]
layer = fire red yellow
layer = blast white

# ---- [complex]: Three layers — rainbow + blast + strobe ----
# Rainbow base, then a transparent blast overlay, then a strobe in ADD
# blend. The blast is transparent (no blend needed). The strobe needs
# ADD + opacity since it's opaque. The three layers stack: you see a
# rainbow blade that flashes white on blast and pulses cyan periodically.
[complex]
layer = rainbow 300 800
layer = blast white
layer = add opacity 16000 strobe black cyan 20 1 300 800

# =============================================================================
# VARIABLES — reuse colors/values, override from presets
# =============================================================================

# ---- [with_vars]: Section-local variables ----
# Variables are defined as  name = value  and referenced as {{name}} in layers.
# Defaults here: cyan blade, white clash, 300/800 ms extension/retraction.
# Presets can override any variable:
#   style = config with_vars base=magenta           -> magenta blade
#   style = config with_vars base=blue clash=yellow  -> blue blade, yellow clash
# The "version = N" line is reserved for future migrations and is not a variable.
[with_vars]
version = 1
base = cyan
clash = white
ext = 300
ret = 800
layer = solid {{base}} {{ext}} {{ret}}
layer = clash {{clash}}
layer = blast white

# =============================================================================
# PALETTES — shared variable sets across sections
# =============================================================================

# ---- [palette_default]: Named palette (shared variables) ----
# A [palette_<id>] section defines variables that other sections can import
# with "palette = <id>". This lets multiple sections share the same color
# scheme without duplicating the definitions.
[palette_default]
base = cyan
clash = white
ext = 300
ret = 800

# ---- [with_palette]: Uses the "default" palette ----
# "palette = default" imports all variables from [palette_default] above.
# The layer then uses {{base}}, {{clash}}, etc. from that palette.
# Result: identical to [with_vars] with its default values.
[with_palette]
palette = default
layer = solid {{base}} {{ext}} {{ret}}
layer = clash {{clash}}

# =============================================================================
# INCLUDES — merge layers or palettes from external files
# =============================================================================

# ---- [rainbow_strobe_included]: Include a fragment file ----
# The rainbow layer is defined here; the strobe overlay is loaded from
# config/blade_styles/strobe_overlay.ini and merged into this section.
# This is useful for sharing common overlays across many sections.
[rainbow_strobe_included]
layer = rainbow 300 800
include = blade_styles/strobe_overlay.ini

# ---- [with_palette_alt]: Palette from an included file ----
# The "alt" palette is defined in config/blade_styles/palettes_extra.ini
# (loaded by the top-level include at the start of this file). This
# section imports those variables and uses them in a standard blade layer.
[with_palette_alt]
palette = alt
layer = solid {{base}} {{ext}} {{ret}}
layer = clash {{clash}}

# =============================================================================
# STRUCTURED LAYERS — key-per-slot alternative to single-line format
# =============================================================================

# ---- [structured_standard]: Structured key format ----
# Instead of  layer = standard cyan white 300 800  you can set each argument
# individually with  layer.<style>.<slot> = value. Slot names for "standard"
# are: base, clash, ext, ret. This is more readable for styles with many args.
# Result is identical to: layer = standard cyan white 300 800
[structured_standard]
layer.standard.base = cyan
layer.standard.clash = white
layer.standard.ext = 300
layer.standard.ret = 800

# ---- [structured_fire]: Structured fire style ----
# Slot names for "fire" are: warm, hot.
# Result is identical to: layer = fire orange red
[structured_fire]
layer.fire.warm = orange
layer.fire.hot = red

# ---- [structured_strobe]: Structured strobe style ----
# Slot names for "strobe" are: standby, flash, freq, flash_ms, ext, ret.
# Result is identical to: layer = strobe black white 18 1 300 800
[structured_strobe]
layer.strobe.standby = black
layer.strobe.flash = white
layer.strobe.freq = 18
layer.strobe.flash_ms = 1
layer.strobe.ext = 300
layer.strobe.ret = 800

# =============================================================================
# BLEND MODES AND OPACITY — controlling how layers combine
# =============================================================================

# ---- [rainbow_faint_strobe]: Opacity only (default normal blend) ----
# No blend keyword = normal (alpha-over). Opacity 12000 (~37%) makes the
# strobe semi-transparent. During strobe flashes, you see a dim white over
# rainbow. During strobe standby (black), you see dim black over rainbow.
# Because normal blend REPLACES, even the black standby phase affects the
# rainbow — dimming it slightly. Compare with ADD below.
[rainbow_faint_strobe]
layer = rainbow 300 800
layer = opacity 12000 strobe black white 15 1 300 800

# ---- [rainbow_multiply_strobe]: Multiply blend ----
# MULTIPLY: each pixel = (base * overlay) / max.
# White overlay → base unchanged. Black overlay → base goes dark.
# The strobe alternates between black (darkens rainbow) and white
# (preserves rainbow). Opacity 20000 (~61%) softens the darkening.
# Result: rainbow that periodically dims to ~39% brightness.
[rainbow_multiply_strobe]
layer = rainbow 300 800
layer = multiply opacity 20000 strobe black white 15 1 300 800

# ---- [rainbow_screen_blast]: Screen blend ----
# SCREEN: each pixel = base + overlay - (base * overlay / max).
# Always brightens or preserves. Black overlay → no change.
# White overlay → approaches white. Softer than ADD (won't clip as hard).
# Result: rainbow with soft white glow when blast fires.
[rainbow_screen_blast]
layer = rainbow 300 800
layer = screen opacity 22000 blast white

# ---- [rainbow_add_strobe]: Add blend ----
# ADD: each pixel = min(base + overlay, max).
# Black overlay → no change (adding zero). White overlay → clipped white.
# Best for bright flashes on top of a base: the strobe's black standby
# phase adds nothing (rainbow shows through), and the white flash phase
# adds bright cyan pulses. Opacity 18000 (~55%) controls flash intensity.
[rainbow_add_strobe]
layer = rainbow 300 800
layer = add opacity 18000 strobe black cyan 22 1 300 800

# ---- [rainbow_normal_explicit]: Explicit "normal" keyword ----
# Same as omitting the blend keyword entirely. Documents that "normal" can
# be written explicitly before "opacity" for clarity.
[rainbow_normal_explicit]
layer = rainbow 300 800
layer = normal opacity 15000 strobe black white 15 1 300 800

# =============================================================================
# NESTED CONFIGS — composing sections from other sections
# =============================================================================

# ---- [base_rainbow_blast]: Helper section (used by nested_config_demo) ----
# A simple two-layer style: rainbow base with blast overlay. This section
# exists to be referenced by [nested_config_demo] below.
[base_rainbow_blast]
layer = rainbow 300 800
layer = blast white

# ---- [nested_config_demo]: Nested section reference ----
# "layer = config base_rainbow_blast" expands [base_rainbow_blast]'s layers
# (rainbow + blast) into this section as a single composite sub-style.
# Then a strobe is added on top with ADD blend. The final result has three
# effective layers (rainbow, blast, strobe) built from two sections.
# This is useful for building complex styles from reusable building blocks.
[nested_config_demo]
layer = config base_rainbow_blast
layer = add opacity 16000 strobe black white 15 1 300 800

# =============================================================================
# COMPLEX PRESETS — advanced multi-layer compositions
# =============================================================================

# ---- [chaos_inferno]: 6-layer unstable fire blade ----
# A chaotic, aggressive blade combining multiple effects. The unstable base
# provides the primary crackling visual with built-in clash/lockup/blast.
# Additional layers add fire warmth, rainbow color shifting, extra blast
# intensity, electric strobe pulses, and audio-reactive shimmer.
#
# VISUAL RESULT: A flickering, crackling red/orange blade with shifting
# rainbow tints, periodic cyan flashes, and a faint blue audio-reactive
# glow. Clash triggers the unstable's LocalizedClash. Blast triggers both
# the unstable's built-in blast AND the extra blast layer for a double hit.
[chaos_inferno]
# Layer 1 — Unstable base (opaque, normal blend)
#   BrownNoiseFlicker + Strobe create the crackling unstable look.
#   Built-in: LocalizedClash, Lockup with AudioFlicker, Blast, OnSpark.
#   This is the primary blade visual — everything else layers on top.
#   IMPORTANT: unstable defaults to 100ms extend / 200ms retract if no
#   args are given. All layers with InOutHelper must use the SAME retract
#   time, otherwise the base retracts first and the overlays are briefly
#   visible on a dark blade (producing an odd color flash on power-off).
#   Args: warm=red, warmer=red, hot=orange, sparks=yellow, ext=300, ret=800.
layer = unstable red red orange yellow 300 800
# Layer 2 — Fire undertone (screen blend, ~30% opacity)
#   A red/yellow fire in SCREEN blend brightens the unstable base with
#   warm, organic rolling flame patterns. Low opacity keeps it subtle —
#   the fire adds warmth without overpowering the crackling effect.
#   Fire has no InOutHelper (no extension/retraction) — it renders
#   continuously. At only 30% screen opacity on top of the retracting
#   base, the fire dims to near-invisible as the base goes dark.
layer = screen opacity 10000 fire red yellow
# Layer 3 — Rainbow color shift (screen blend, ~18% opacity)
#   A rainbow blade in SCREEN blend adds slowly cycling hue tints.
#   Very low opacity — just enough to notice shifting color undertones
#   without turning the blade into a full rainbow.
#   Extend/retract times match the unstable base (300/800).
layer = screen opacity 6000 rainbow 300 800
# Layer 4 — Extra blast flash (transparent, normal blend, full opacity)
#   BlastL is transparent until a blast event. When triggered, it adds a
#   white flash ON TOP of the unstable's own blast for a brighter double hit.
layer = blast white
# Layer 5 — Cyan strobe pulses (add blend, ~15% opacity)
#   A strobe in ADD blend fires periodic cyan flashes. ADD with black
#   standby means the strobe is invisible between pulses (adding black
#   = adding nothing). The cyan flashes add electric energy.
#   18 Hz frequency, 1 ms pulse width.
#   Extend/retract times match the unstable base (300/800).
layer = add opacity 5000 strobe black cyan 18 1 300 800
# Layer 6 — Blue audio shimmer (add blend, ~12% opacity)
#   A standard blue blade at very low opacity in ADD blend. The standard
#   style includes AudioFlicker in its lockup and SimpleClash, which react
#   to sound and impacts. At 12% opacity, this adds a faint blue glow that
#   subtly shifts with the hum frequency and brightens on clash.
#   Extend/retract times match the unstable base (300/800).
layer = add opacity 4000 solid blue 300 800

# =============================================================================
# PREON / POSTOFF EFFECTS — pre-ignition and post-retraction animations
# =============================================================================
#
# Preon and postoff layers add visual effects to the blade BEFORE ignition
# and AFTER retraction. They are transparent during normal blade operation
# and only activate on their trigger events.
#
# FULL SEQUENCE (with preon + postoff):
#   1. User presses "on"
#   2. EFFECT_PREON fires → preon layer activates (e.g. blue glow pulse)
#      Preon sound plays (if font has preon/ folder with WAV files)
#   3. Preon sound ends (visual length = WavLen) → main blade ignites
#   4. Saber is ON — preon/postoff layers are fully transparent (invisible)
#      Normal blade operation: clash, lockup, blast all work as usual
#   5. User presses "off"
#   6. Main blade retracts (retraction animation)
#   7. Blade is fully retracted → EFFECT_POSTOFF fires
#   8. Postoff layer activates (e.g. red wipe or glow)
#   9. Postoff sound ends (visual length = WavLen) → blade LEDs power off
#
# USAGE:
#   Just add preon/postoff styles as regular layers. No blend mode or
#   opacity is needed — they handle their own transparency. You can use
#   any combination: just preon, just postoff, both, or multiple of each.
#   They work alongside any other layers (standard, fire, blast, etc.).
#
# AVAILABLE PREON/POSTOFF STYLES:
#   preon_glow <color>      — uniform glow, brightness = sound volume
#   preon_wipe <color>      — hilt→tip wipe over sound duration
#   preon_sputter <color>   — blade length = sound volume (extends/retracts)
#   postoff_glow <color>    — uniform glow, brightness = sound volume
#   postoff_wipe <color>    — tip→hilt wipe over sound duration
#   postoff_sputter <color> — blade length = sound volume (extends/retracts)
#   force_glow <color> — glow on Force effect while blade is on
#
# TIPS:
#   - All preon/postoff/force_glow styles only need a COLOR argument. Duration and
#     intensity are automatically driven by the sound file (via WavLen
#     and SmoothSoundLevel). No manual timing to tune.
#   - Audio-reactive effects (glow, sputter) are transparent when audio
#     is silent, so they won't produce artifacts when no sound files exist.
#   - Use glow for a uniform pulse effect, sputter for a chaotic
#     extending/retracting blade, and wipe for a directional sweep.
#   - Preon colors don't need to match the main blade color — contrasting
#     colors (e.g. blue preon on a red blade) create dramatic effects.
#   - You can stack multiple preon layers for complex startup sequences
#     (they all trigger simultaneously on EFFECT_PREON).

# ---- [mystic_awakening]: Preon glow + postoff wipe demo ----
# A standard blade with a blue preon glow before ignition and a red
# retraction wipe after shutdown. Both effects automatically match the
# preon/postoff sound file duration — no manual timing needed.
#
# TIMELINE:
#   Button press → blue glow pulsates with preon sound volume (duration
#   = preon sound file length) → preon sound ends → main cyan blade
#   ignites → normal operation → blade retracts (800ms) → red wipe
#   sweeps from tip to hilt over postoff sound duration → LEDs off.
#
# AUDIO-REACTIVE: The preon glow brightness tracks the preon sound
# volume in real time. Loud moments = bright glow, quiet = dim.
# As the preon sound fades at the end, the glow naturally dims before
# the main blade ignites, creating a smooth transition.
[mystic_awakening]
# Layer 1 — Main blade (opaque, normal blend)
#   Solid cyan base; clash and blast are separate overlay layers.
layer = solid cyan 300 800
# Layer 2 — Clash flash
layer = clash white
# Layer 3 — Blast overlay (transparent until blast event)
layer = blast white
# Layer 3 — Pre-ignition glow (EFFECT_PREON, audio-reactive)
#   preon_glow: entire blade glows blue, brightness follows preon sound
#   volume. Duration automatically matches preon sound file length.
layer = preon_glow blue
# Layer 4 — Post-retraction wipe (EFFECT_POSTOFF)
#   postoff_wipe: red color wipes from tip to hilt over the postoff
#   sound duration. Creates a visible retraction animation after shutdown.
layer = postoff_wipe red

# ---- [force_glow_demo]: Standard blade + Force glow overlay ----
# While ignited, trigger Force (prop/button) → white glow follows force sound volume.
# Requires font with force/ (or mpush) and EFFECT_FORCE wired on the saber.
# Use add blend so glow brightens the base without covering it fully.
[force_glow_demo]
base = cyan
clash = white
ext = 300
ret = 800
layer = solid {{base}} {{ext}} {{ret}}
layer = clash {{clash}}
layer = blast {{clash}}
layer = add opacity 14000 force_glow white

# ---- [spectral_gate]: Preon wipe + postoff wipe demo ----
# A more dramatic preon/postoff using wipe effects. The preon sweeps
# green from hilt to tip over the preon sound duration. On shutdown,
# white energy drains from tip back to hilt over the postoff sound.
#
# TIMELINE:
#   Button press → green wipe hilt→tip (over preon sound duration) →
#   preon sound ends → main green blade ignites → normal operation →
#   blade retracts (800ms) → white wipe tip→hilt (over postoff sound
#   duration) → LEDs off.
[spectral_gate]
# Layer 1 — Main green blade
layer = solid green 300 800
# Layer 2 — Clash flash
layer = clash white
# Layer 3 — Blast overlay
layer = blast white
# Layer 3 — Pre-ignition wipe (EFFECT_PREON)
#   preon_wipe: sweeps green from hilt to tip. Duration automatically
#   matches the preon sound file length via WavLen.
layer = preon_wipe green
# Layer 4 — Post-retraction drain (EFFECT_POSTOFF)
#   postoff_wipe: white drains from tip to hilt. Duration automatically
#   matches the postoff sound file length via WavLen.
layer = postoff_wipe white

# ---- [inferno_ritual]: Fire blade with preon + postoff ----
# Combines fire (no built-in extension animation) with preon/postoff.
# The preon creates an orange glow whose brightness follows the preon
# sound (like a pilot light warming up with audio). The postoff wipes
# red embers from tip to hilt, simulating the fire dying down.
#
# TIMELINE:
#   Button press → orange glow pulsates with preon sound volume (over
#   preon sound duration) → preon ends → fire ignites → flames roll →
#   blade off → red wipe tip→hilt (over postoff sound duration)
#   → LEDs off.
[inferno_ritual]
# Layer 1 — Fire base (opaque, rolling flame animation)
layer = fire red yellow
# Layer 2 — Blast overlay
layer = blast white
# Layer 3 — Pilot light preon (EFFECT_PREON, audio-reactive)
#   Orange glow: brightness follows preon sound volume in real time.
#   Duration automatically matches preon sound file length.
#   As the preon sound fades, the glow dims naturally before fire ignites.
layer = preon_glow orange
# Layer 4 — Cooling embers postoff (EFFECT_POSTOFF)
#   Red wipe: sweeps from tip to hilt over the postoff sound duration.
#   Simulates embers cooling from the tip back toward the hilt.
layer = postoff_wipe red

