# =============================================================================
# GPIO ACCENT RECIPES (simple PWM blades in presets.ini — blade indices 2–4)
# =============================================================================
# Use in presets.ini:  style = config accent_glow_clash
# accent_* bases are off when the saber retracts; overlay layers add clash/lockup/swing.
# accent_sound_on is NOT blade-gated: full on while SmoothSoundLevel > threshold (good for
# geared motors through postoff tail). accent_on = solid on only while blade is out.
#
# COMPOSABLE TEXTURES ON PWM (single LED):
#   Main-blade recipes use solid_bend + multiply/screen textures (audio_layer, pulse_layer,
#   fire_mask, stripes, …). The same texture layers work on accents — on one pixel they
#   modulate uniform brightness (hum, breathe, crackle, rolling heat). Stack them on accent_color
#   or accent_on instead of accent_glow when you want a fixed hue with composable motion.
#   See accent_composable_* sections below (mirrors [composable_audio], [composable_breathe],
#   [composable_crackle], [solid_smoke] patterns).

