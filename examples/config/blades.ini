# =============================================================================
# config/blades.ini - Blade wiring (data pin, pixels, power pins)
# =============================================================================
# Copy this file to the root of your SD card as:  config/blades.ini
#
# When present and valid, this REPLACES the compiled blade configuration at
# runtime (Proffieboard). Each entry is: blade=<index>, then wiring fields, "end".
#
# NeoPixel (default): data_pin=, pixels=, power_pin= (or power_pin1..power_pin6)
# Simple PWM LED: type=simple, data_pin= or pin1=..pin4=, led= or led1=..led4=
#   active_state=high|low (or active_state1..4; active_high= is an alias) — default high
#
# Pin values can be numbers (e.g. 20) or board pin names (e.g. bladePowerPin1)
# if your config defines them. Up to 16 blades; up to 6 power pins per NeoPixel blade.
#
# Presets use five style = lines (indices 2–4: accent_pulse / accent_sound_on / accent_glow).
# All five blade= entries below are required when NUM_BLADES is 5 — omitting accent indices
# prevents those outputs from activating at boot (even if styles are set in presets.ini).
#
# More examples and use cases: website/BLADES.md (SD Config Editor guide).
# =============================================================================

# ---- Blade 0: main blade ----
blade = 0
data_pin = bladePin
pixels = 144
power_pin = bladePowerPin1

# ---- Blade 1: second strip ----
blade = 1
data_pin = blade2Pin
pixels = 60
power_pin1 = bladePowerPin2
power_pin2 = bladePowerPin3

# ---- Blade 2: accent on Free1 (accent_pulse 1500) ----
# active_state: use "high" for GPIO -> LED -> GND (same as ActiveHighPIN in firmware).
# Use "low" only if the Free pin drives an N-FET gate (same as bladePowerPin FETs).
blade = 2
type = simple
data_pin = blade5Pin
led = CreeXPE2White
active_state = high

# ---- Blade 3: accent on Free2 (motor: accent_on = blade-out; accent_sound_on = while audio plays) ----
blade = 3
type = simple
data_pin = blade6Pin
led = CreeXPE2White
active_state = high

# ---- Blade 4: accent on Free3 (accent_glow) ----
blade = 4
type = simple
data_pin = blade7Pin
led = CreeXPE2White
active_state = high

# ---- Required: end of blade definitions ----
end
