# =============================================================================
# config/features.ini - Feature toggles (gesture ignition)
# =============================================================================
# Copy this file to the root of your SD card as:  config/features.ini
#
# This file is read AFTER config/board.ini. These keys OVERRIDE the same
# values from board.ini. gesture is the master switch. The others each
# control one ignition or retraction.
# =============================================================================

# Master switch for gesture ignition and twist-off.
gesture = on

# Swing ignition. Off so moving the hilt does not light the blade.
swing_on = off

# Thrust ignition.
thrust_on = on

# Stab ignition.
stab_on = on

# Twist to turn on.
twist_on = on

# Twist to turn off.
twist_off = on

# Roll speed required for twist on and twist off, in degrees per second.
# Higher is harder to trigger. Omit this line to use PROFFIE_TWIST_THRESHOLD (200 unless #defined).
twist_deg = 350
