# =============================================================================
# config/board.ini - Board hardware configuration
# =============================================================================
# Copy this file to the root of your SD card as:  config/board.ini
# The firmware reads it at startup (when SD is enabled) to set hardware and
# optional feature options without recompiling.
#
# Put HARDWARE here: how many buttons are live, which pad each one uses,
# OLED, Bluetooth. Optionally gesture/twist (those can also go in
# config/features.ini so contest-only overrides are easy).
# =============================================================================

# ---- Buttons ----
# buttons is how many of the compiled buttons are scanned, up to NUM_BUTTONS.
# Leave power/aux unset to keep the compiled pads (powerButtonPin and auxPin).
# To swap which pad is power and which is aux:
#   power = auxPin
#   aux = powerButtonPin
buttons = 2

# ---- OLED display ----
# on = use display (if compiled in); off = disable at runtime.
oled = on

# ---- Bluetooth serial (Serial3) ----
# Only used when the firmware is built with ENABLE_SERIAL.
# on = start Serial3 for BT serial commands; off = do not start Serial3.
bluetooth = on

# ---- Optional: gesture switches (prefer config/features.ini) ----
# If config/features.ini exists, its values override these.
# gesture   = master switch for gesture ignition
# swing_on  = swing to ignite
# thrust_on = thrust to ignite
# stab_on   = stab to ignite
# twist_on  = twist to ignite
# twist_off = twist to retract
gesture = on
swing_on = off
thrust_on = on
stab_on = on
twist_on = on
twist_off = on
