# =============================================================================
# BMP blade pack — strip_column bases + shared combat stack
# =============================================================================
# Copy pack to SD root: config/ + animations/
#
# Presets:  style = config bmp_gallery_<name>
# All sections use source_height 144. fps is 30 unless noted
# (nebula: 15 fps, ghost trail's second copy: 8 fps).
# A transition line owns the wipe. With no transition line, {{ext}} {{ret}} on the
# first layer (strip_column or solid) is the bend wipe, so those times stay on
# the layer as the fallback. -1 matches the ignition / retraction sound length.
# =============================================================================

# ---- Shared combat (same on every gallery blade) ----
# real_clash + blast_wave_random + responsive_lockup + drag/melt/lb

# ---- [bmp_gallery_cyan_gold]: Cyan/gold plasma flipbook (bare art) ----
[bmp_gallery_cyan_gold]
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
transition = split {{ext}} {{ret}}
layer = strip_column animations/cyan-gold-plasma.bmp 144 30 {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [bmp_gallery_cyan_plasma]: Cooler cyan plasma + light sine shimmer ----
# Wipe is animations/ignition-retraction-plasma-map.bmp (144 x 30 frames).
# {{ext}}/{{ret}} on the transition line scrubs every row across the ignition/retraction wav.
[bmp_gallery_cyan_plasma]
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
transition = bmp animations/ignition-retraction-plasma-map.bmp 144 {{ext}} {{ret}}
layer = strip_column animations/cyan-plasma.bmp 144 30 {{ext}} {{ret}}
layer = multiply opacity 35% sine_waves 2400 0 12.5% 100% -2000
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

