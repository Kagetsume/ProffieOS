layer = lb {{lb}}

# ---- [bmp_gallery_fire]: Fire column loop with a flame wipe ----
# Idle art is fire-column.bmp. Ignition and retraction use the flame transition:
# yellow tongues ahead of the edge, streaks peeling toward the tip on the way back.
[bmp_gallery_fire]
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
transition = flame {{ext}} {{ret}} yellow
layer = strip_column animations/fire-column.bmp 144 30 {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [bmp_gallery_lightning]: Lightning crawl + strike / drain wipes ----
# Idle loop is lightning-column.bmp. Ignition scrubs lightning-strike.bmp from
# row 0 (bolt at the hilt) to the last row (fully open). Retract plays
# lightning-drain.bmp backward: its last row is fully lit, row 0 is black.
[bmp_gallery_lightning]
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
transition_in = bmp animations/lightning-strike.bmp 144 {{ext}}
transition_out = bmp animations/lightning-drain.bmp 144 {{ret}}
layer = strip_column animations/lightning-column.bmp 144 30 {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [bmp_gallery_nebula]: Slow nebula drift (BMP: nebula-drift.bmp — 15 fps) ----
[bmp_gallery_nebula]
