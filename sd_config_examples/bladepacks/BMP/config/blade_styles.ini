layer = lb {{lb}}

# ---- [bmp_gallery_cyan_mask]: Solid base + BMP opacity map (not full-color strip_column base) ----
# Layer 0 = flat {{base}}. No transition line, so {{ext}} {{ret}} on solid is the bend wipe.
# Layer 1 = multiply strip_column_mask (24-bit BMP;
# R=G=B). Black (0) = dark gaps, white = full base — mid-gray “background” barely dims multiply.
# Shipped: animations/plasma-opacity-mask.bmp. Alt: cyan-plasma.bmp (color→luminance). Serial:
# strip_column_mask: opened … vs missing / need 24-bit uncompressed BMP.
[bmp_gallery_cyan_mask]
base = cyan
mask_opacity = 80%
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity {{mask_opacity}} strip_column_mask animations/plasma-opacity-mask.bmp 144 30
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [bmp_gallery_crazy_blade]: Crazy Blade — cyan plasma BMP + sine + rainbow + bands ----
# strip_column art, four sine multiply masks, 50% rainbow tint, rolling random_bands.
[bmp_gallery_crazy_blade]
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
rainbow_mix = 10%
layer = strip_column animations/cyan-plasma.bmp 144 30 {{ext}} {{ret}}
layer = multiply opacity 67% sine_waves 2400 0 6.2% 100% -2000 1800 512 0 75% -2800 3200 0 12.5% 100% 1500 2200 256 18.7% 100% 2200
layer = normal opacity {{rainbow_mix}} rainbow_layer
layer = multiply opacity 73% random_bands -600 cyan black 2800
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [bmp_gallery_ember_mask]: one grayscale BMP, any base color ----
# Mostly lit, with dark cracks. White in the file is the full base color, black is a gap.
# Change base= to recolor the same picture. hue_waves crawls that color along the blade.
[bmp_gallery_ember_mask]
base = darkorange
mask_opacity = 100%
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity {{mask_opacity}} strip_column_mask animations/ember-cracks.bmp 144 30
layer = hue opacity 100% hue_waves 10000 0 0 5000 -220
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [bmp_gallery_ink_bleed]: the BMP is the wipe ----
# Idle is solid + fbm_noise. Ignition and retraction scrub ink-bleed.bmp.
# White is lit, black is covered. Frame 0 is a spark at the hilt. The last frame
# is solid white, and retraction plays those frames backward, so the ink pulls
# back to the hilt. Fingers and droplets run ahead of the wet edge.
[bmp_gallery_ink_bleed]
base = deepskyblue
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
transition = bmp animations/ink-bleed.bmp 144 {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 60% fbm_noise 3200 -600 45% 100% 70%
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [bmp_gallery_comet]: one bright head over a dim body ----
# comet-run.bmp is black except a cyan-white head and a gold tail. Screen leaves
# the black pixels at the steelblue body. The head runs hilt to tip and loops.
[bmp_gallery_comet]
base = steelblue
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = screen opacity 100% strip_column animations/comet-run.bmp 144 30
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [bmp_gallery_ghost_trail]: one file, two speeds ----
# The same fire column plays at 30 fps, and again at 8 fps screened faintly.
# Each copy has its own frame ring. The slow copy lags, which reads as a ghost.
[bmp_gallery_ghost_trail]
ext = -1
ret = -1
clash = white
lockup = white
drag = white
melt = orange
lb = white
transition = flame {{ext}} {{ret}} yellow
layer = strip_column animations/fire-column.bmp 144 30 {{ext}} {{ret}}
layer = screen opacity 25% strip_column animations/fire-column.bmp 144 8
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
