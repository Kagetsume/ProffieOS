# =============================================================================
# Extended Universe blade pack — Legends / exotic blades (layer-first)
# =============================================================================
# Copy to SD: config/blade_styles.ini
#
# Presets:  style = config eu_darksaber | eu_crackle | eu_starkiller | eu_fallen_order | eu_ahsoka_padawan | eu_ahsoka_white | eu_blade_of_talzin | eu_baylan_skoll | eu_nomi_sunrider | eu_mara_jade | eu_revan_purple | eu_revan_red | …
# Overrides: base= clash= lockup= kinetic= ext= ret= drag= melt= lb=
# ext/ret default -1 = match ignition / retraction sound length.
# =============================================================================

# ---- [eu_darksaber]: Clone Wars / Mandalorian DarkSaber ----
# Fett263 OS7 idle via darksaber_layer + solid + responsive combat overlays.
[eu_darksaber]
base = silver
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
layer = solid {{base}} {{ext}} {{ret}}
layer = normal opacity 100% darksaber_layer {{base}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [eu_crackle]: Legends-style unstable crackle (composable, not OS7 unstable_blades) ----
# Per-LED + brown-noise crackle over a solid base. Generic silver; Starkiller is eu_starkiller.
# Override base=purple / base=red for other EU characters.
[eu_crackle]
base = silver
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 43% per_led_flicker
layer = multiply opacity 27% noise_flicker black white
layer = multiply opacity 18% base_flicker 8 400 600
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [eu_starkiller]: The Force Unleashed — Galen Marek ----
# Blue core with white lightning screened on top. Multiply-only crackle stays eu_crackle.
[eu_starkiller]
base = dodgerblue
spark = white
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 35% per_led_flicker
layer = screen opacity 55% noise_flicker black {{spark}}
layer = screen opacity 30% base_flicker 6 200 400
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

