# =============================================================================
# First Order blade pack — Sequel trilogy blades (layer-first)
# =============================================================================
# Copy to SD: config/blade_styles.ini
#
# Presets:  style = config fo_kylo_unstable | fo_rey_yellow
# Overrides: base= warmer= hot= spark= clash= onspark= ext= ret= drag= melt= lb=
# =============================================================================

# ---- [fo_kylo_unstable]: Kylo Ren — composable monolith "unstable" ----
# Layers mirror monolith idle + OnSpark + LocalizedClash + Lockup branch + Blast (+ drag/melt/lb).
[fo_kylo_unstable]
base = red
warmer = red
hot = orange
spark = yellow
onspark = white
clash = white
ext = -1
ret = -1
drag = white
melt = orange
lb = white
transition = spark {{ext}} {{ret}} bend {{spark}}
layer = solid {{base}} {{ext}} {{ret}}
layer = normal opacity 100% unstable_layer {{base}} {{warmer}} {{hot}} {{spark}}
layer = add opacity 100% on_spark_layer {{onspark}} 100
layer = normal opacity 100% unstable_lockup_layer {{warmer}} {{onspark}} 200
layer = localized_clash {{clash}}
layer = blast {{clash}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [fo_rey_yellow]: The Rise of Skywalker — Rey's repaired yellow saber ----
# One NeoPixel shows that single blade. 255,190,0 keeps green under red so the blade stays gold-yellow.
[fo_rey_yellow]
base = 255,190,0
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
layer = solid {{base}} {{ext}} {{ret}}
layer = normal opacity 70% shimmer_blade_layer {{base}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
