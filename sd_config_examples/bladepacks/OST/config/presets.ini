# =============================================================================
# OST blade pack — Original Trilogy character presets
# =============================================================================
# Copy to SD: config/presets.ini
#
# Shared hum/clash font: SD card folder TeensySF/  (font= is the directory name, not Fonts/…)
# Per-preset WAV overrides: SD root font/<PresetName>/  (font_overlay= below)
# =============================================================================

new_preset
font = TeensySF
font_overlay = font/LukeANH
track = tracks/hum.wav
style = config ost_classic base=blue
name = LukeANH
variation = 0

new_preset
font = TeensySF
font_overlay = font/ObiWan
track = tracks/hum.wav
style = config ost_classic base=blue
name = ObiWan
variation = 0

new_preset
font = TeensySF
font_overlay = font/Vader
track = tracks/hum.wav
style = config ost_classic base=red
name = Vader
variation = 0

new_preset
font = TeensySF
font_overlay = font/LukeROTJ
track = tracks/hum.wav
style = config ost_classic base=green
name = LukeROTJ
variation = 0

new_preset
font = TeensySF
font_overlay = font/Windu
track = tracks/hum.wav
