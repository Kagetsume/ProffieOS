# =============================================================================
# Custom blade pack — presets
# =============================================================================
# Copy to SD: config/presets.ini
#
# font= is an SD root folder (e.g. TeensySF/). font_overlay= per character WAV overrides.
# =============================================================================

new_preset
font = TeensySF
font_overlay = font/WornAquamarine
track = tracks/hum.wav
style = config custom_worn_aquamarine
name = WornAquamarine
variation = 0

