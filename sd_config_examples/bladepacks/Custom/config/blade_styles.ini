# =============================================================================
# Custom blade pack — non-canon recipes
# =============================================================================
# Copy to SD: config/blade_styles.ini
#
# Presets:  style = config custom_worn_aquamarine | custom_flame_wipe | custom_tip_ignite | custom_center_burst | custom_hum_glow | custom_crystal_gradient
# Overrides: base= sputter= clash= lockup= ext= ret= drag= melt= lb=
# ext/ret default -1 = match ignition / retraction sound length.
# preon_sputter and postoff_sputter take a color only. Their length follows
# the preon and pstoff sound files.
# =============================================================================

# ---- [custom_worn_aquamarine]: old crystal, sputtering start and shutdown ----
# Idle flicker keeps the lit blade unsteady. preon_sputter runs before ignition:
# loud parts of the preon sound push the blade out, quiet parts pull it back.
# postoff_sputter does the same after the main blade has retracted, on the pstoff sound.
[custom_worn_aquamarine]
base = aquamarine
sputter = aquamarine
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 35% per_led_flicker
layer = multiply opacity 20% noise_flicker black white
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
layer = preon_sputter {{sputter}}
layer = postoff_sputter {{sputter}}

# ---- [custom_flame_wipe]: ignition and retraction are a flame front ----
# The lit beam is darkorange. Yellow streaks run ahead of the edge on the way out
# and peel off toward the tip on the way back.
[custom_flame_wipe]
base = darkorange
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = flame {{ext}} {{ret}} yellow
layer = solid {{base}} {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_tip_ignite]: the blade extends from the tip ----
# tip means extend tip→hilt and retract back to the tip.
[custom_tip_ignite]
base = deepskyblue
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}} tip
layer = solid {{base}} {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_center_burst]: lit band grows from the middle ----
# Extend runs out to the hilt and the tip. Retract draws both edges back to the middle.
# White spark marks the two moving edges.
[custom_center_burst]
base = violentviolet
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = explode {{ext}} {{ret}} spark white
layer = solid {{base}} {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_hum_glow]: brightness follows the hum ----
# audio_layer is a black-to-white loudness mask. Multiply leaves a quiet blade dim
# and a loud hum at full amber.
[custom_hum_glow]
base = amber
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 80% audio_layer
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_crystal_gradient]: one color at the hilt, another at the tip ----
# gradient_layer paints over the solid. The bend wipe still comes from the transition line.
[custom_crystal_gradient]
hilt = green
tip = deepskyblue
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{hilt}} {{ext}} {{ret}}
layer = normal opacity 100% gradient_layer {{hilt}} {{tip}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
