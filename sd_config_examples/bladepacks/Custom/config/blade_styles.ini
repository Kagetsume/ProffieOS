# =============================================================================
# Custom blade pack — non-canon recipes
# =============================================================================
# Copy to SD: config/blade_styles.ini
#
# Presets:  style = config custom_worn_aquamarine | custom_flame_wipe | custom_tip_ignite | custom_center_burst | custom_hum_glow | custom_crystal_gradient | custom_hue_tide | custom_swing_ripple | custom_moire | custom_chirp | custom_smoke_core | custom_emitter_bloom | custom_crystal_weather
# Overrides: base= sputter= clash= lockup= ext= ret= drag= melt= lb=
# ext/ret default -1 = match ignition / retraction sound length.
# preon_sputter and postoff_sputter take a color only. Their length follows
# the preon and pstoff sound files.
# =============================================================================

# ---- [custom_worn_aquamarine]: old crystal, sputtering start and shutdown ----
# Idle flicker keeps the lit blade unsteady. The tip creeps and tints white.
# A lockup walks the hue toward orange. A clash leaves a white patch that fades.
# preon_sputter runs before ignition: loud parts of the preon sound push the blade
# out, quiet parts pull it back. postoff_sputter does the same after retraction.
[custom_worn_aquamarine]
base = aquamarine
sputter = aquamarine
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 35% per_led_flicker
layer = multiply opacity 20% noise_flicker black white
layer = normal opacity 100% unstable_tip white 7000 1100
layer = warm opacity 100% lockup_heat 5461 1200
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = screen opacity 100% clash_scar {{clash}} 1000 7000
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
layer = preon_sputter {{sputter}}
layer = postoff_sputter {{sputter}}

# ---- [custom_flame_wipe]: ignition and retraction are a flame front ----
# The lit beam is darkorange. Yellow streaks run ahead of the edge on the way out
# and peel off toward the tip on the way back.
[custom_flame_wipe]
base = darkorange
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = flame {{ext}} {{ret}} yellow
layer = solid {{base}} {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_tip_ignite]: the blade extends from the tip ----
# tip means extend tip→hilt and retract back to the tip.
[custom_tip_ignite]
base = deepskyblue
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}} tip
layer = solid {{base}} {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_center_burst]: lit band grows from the middle ----
# Extend runs out to the hilt and the tip. Retract draws both edges back to the middle.
# White spark marks the two moving edges.
[custom_center_burst]
base = violentviolet
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = explode {{ext}} {{ret}} spark white
layer = solid {{base}} {{ext}} {{ret}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_hum_glow]: brightness follows the hum ----
# audio_layer is a black-to-white loudness mask. Multiply leaves a quiet blade dim
# and a loud hum at full amber.
[custom_hum_glow]
base = amber
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 80% audio_layer
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_crystal_gradient]: one color at the hilt, another at the tip ----
# gradient_layer paints over the solid. The bend wipe still comes from the transition line.
[custom_crystal_gradient]
hilt = green
tip = deepskyblue
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{hilt}} {{ext}} {{ret}}
layer = normal opacity 100% gradient_layer {{hilt}} {{tip}}
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_hue_tide]: color crawls, brightness stays ----
# hue_waves shifts hue along the blade. Hue blend keeps the beam lit while the
# color drifts. Slow period, small shift: an oil-slick crawl, not a rainbow.
[custom_hue_tide]
base = cyan
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = hue opacity 100% hue_waves 8000 0 0 6000 -400
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_swing_ripple]: one wave tightens when you swing or twist ----
# sine_waves_swing shortens its own wavelength. The rest of the blade does not speed up.
# Slots 2–4 stay off (period 0). The last two numbers are swing and twist scale.
[custom_swing_ripple]
base = green
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 70% sine_waves_swing 2800 0 18% 100% -1400 0 0 0 100% 0 0 0 100% 0 0 0 100% 0 0 0 100% 0 100% 14000 9000
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_moire]: two close wavelengths beat against each other ----
# Not a whole-blade pulse and not one traveling sine. The swell is the interference.
[custom_moire]
base = magenta
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 75% moire_mask 2400 2450 -2000 2100 12.5% 100%
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_chirp]: wide bands at the hilt, fine ripples at the tip ----
# Negative chirp rate shrinks the wavelength toward the tip. Negative speed scrolls outward.
[custom_chirp]
base = yellow
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 70% chirp 6000 -1600 10% 100% -10000
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_smoke_core]: slow smoke, softer than a flame blade ----
# Multiply knocks the dark bands down. A thin screen of the same smoke tints the bright ones.
[custom_smoke_core]
base = silver
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = multiply opacity 70% smoke_flow black white 1
layer = screen opacity 14% smoke_flow black {{base}} 1
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_emitter_bloom]: the hilt crystal follows the hum ----
# The envelope is a white pool at the hilt. The last argument follows the smoothed
# hum, so that pool lifts and settles with the volume. The blue body stays steady.
# The pool stays at least partly lit, so a buzzing hum does not strobe the blade.
[custom_emitter_bloom]
base = blue
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{base}} {{ext}} {{ret}}
layer = add opacity 100% blade_envelope 0 8000 0 100% 0 100%
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}

# ---- [custom_crystal_weather]: the two-color ramp with noise inside it ----
# Same hilt-to-tip pair as custom_crystal_gradient. fbm_noise is weather in the ramp.
# The clean gradient section is unchanged.
[custom_crystal_weather]
hilt = green
tip = deepskyblue
clash = white
lockup = white
drag = white
melt = orange
lb = white
ext = -1
ret = -1
transition = bend {{ext}} {{ret}}
layer = solid {{hilt}} {{ext}} {{ret}}
layer = normal opacity 100% gradient_layer {{hilt}} {{tip}}
layer = multiply opacity 60% fbm_noise 3200 -600 45% 100% 70%
layer = real_clash {{clash}} 49%
layer = blast_wave_random {{clash}}
layer = responsive_lockup {{lockup}}
layer = drag {{drag}}
layer = melt {{melt}}
layer = lb {{lb}}
