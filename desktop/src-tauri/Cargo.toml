[package]
name = "layerblade-desktop"
version = "0.1.0"
description = "LayerBlade desktop shell for ProffieOS SD config editing"
authors = ["ProffieOS contributors"]
edition = "2021"

[lib]
name = "layerblade_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
